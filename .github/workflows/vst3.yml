name: VST3 builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/vst3.yml'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'plugin/**'
      - 'src/**'
      - 'web-ui/**'
      - 'third_party/JUCE'
      - '.gitmodules'
  pull_request:
    paths:
      - '.github/workflows/vst3.yml'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'plugin/**'
      - 'src/**'
      - 'web-ui/**'
      - 'third_party/JUCE'
      - '.gitmodules'

permissions:
  contents: read

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-universal
          - os: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb xauth \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Ensure Ninja on macOS
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Configure
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVERB_BUILD_PLUGIN=ON -DVERB_AVX2=OFF "${extra[@]}"

      - name: Build plug-in and tests
        run: cmake --build build --target VerbPlugin_VST3 VerbPluginTest tail_regression quality_test energy_test --parallel 2

      # The long path-bake suites (E9, E19, E28; 900 s limits each) are skipped here to keep the job well inside its
      # time limit; run them locally: VERB_ONLY_E19=1 / VERB_ONLY_E28=1 VerbPluginTest. web_bridge is built and run by
      # its own step below (it is not part of the main build target list).
      - name: Test
        run: |
          slow='^((E9|E19|E28)_suite|web_bridge)$'
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build --output-on-failure --timeout 600 -E "$slow"
          else
            ctest --test-dir build --output-on-failure --timeout 600 -E "$slow"
          fi

      # macOS: the web editor is compiled into the plug-in (system WKWebView, no extra dependencies). The headless
      # bridge test is built without the web UI there (its web part uses Win32 APIs); a failure here is reported but
      # does not block the package. Linux builds the classic interface only.
      - name: Bridge test (macOS, non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cmake --build build --target VerbWebBridgeTest --parallel 2
          ctest --test-dir build --output-on-failure --timeout 300 -R '^web_bridge$'

      - name: Verify and ad-hoc sign macOS Universal bundle
        if: runner.os == 'macOS'
        run: |
          bundle="build/plugin/VerbPlugin_artefacts/Release/VST3/Verb Room.vst3"
          lipo "$bundle/Contents/MacOS/Verb Room" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"

      - name: Package
        run: python3 ci/package_vst3.py --build-dir build --platform '${{ matrix.platform }}' --output-dir dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: VerbRoom-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tests-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/LastTest.log
            out/**/*.png
          if-no-files-found: ignore
          retention-days: 14
