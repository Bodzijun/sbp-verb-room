name: VST3 builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/vst3.yml'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'plugin/**'
      - 'src/**'
      - 'third_party/JUCE'
      - '.gitmodules'
  pull_request:
    paths:
      - '.github/workflows/vst3.yml'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'plugin/**'
      - 'src/**'
      - 'third_party/JUCE'
      - '.gitmodules'

permissions:
  contents: read

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-universal
          - os: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb xauth \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Ensure Ninja on macOS
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Configure
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVERB_BUILD_PLUGIN=ON -DVERB_AVX2=OFF "${extra[@]}"

      - name: Build plug-in and tests
        run: cmake --build build --target VerbPlugin_VST3 VerbPluginTest tail_regression quality_test energy_test stage2_test tail_transition_test --parallel 2

      - name: Test
        # stage2_fixes is the exhaustive decay/tail regression (about 15 minutes on a fast
        # desktop CPU); it is run locally before a release and is not built or run here.
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build --output-on-failure --timeout 600 -E '^stage2_fixes$'
          else
            ctest --test-dir build --output-on-failure --timeout 600 -E '^stage2_fixes$'
          fi

      - name: Verify and ad-hoc sign macOS Universal bundle
        if: runner.os == 'macOS'
        run: |
          bundle="build/plugin/VerbPlugin_artefacts/Release/VST3/Verb Room.vst3"
          lipo "$bundle/Contents/MacOS/Verb Room" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"

      - name: Package
        run: python3 ci/package_vst3.py --build-dir build --platform '${{ matrix.platform }}' --output-dir dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: VerbRoom-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tests-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/LastTest.log
            out/**/*.png
          if-no-files-found: ignore
          retention-days: 14
